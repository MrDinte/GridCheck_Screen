; GridCheck firmware for the Waveshare ESP32-S3-Touch-LCD-7B (1024x600, 16MB flash, 8MB PSRAM).
; ESP-IDF 5 (not Arduino): the RGB screen needs ESP-IDF's bounce buffers and
; code running from PSRAM to stay stable while Wi-Fi is busy.
;
;   pio run                 build
;   pio run -t upload       flash over the board's "UART" USB-C port
;   pio device monitor      watch the log (115200 baud)
;   sh tools/package.sh     build the single file used by web/flash.html

[env:waveshare_7b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -DEH_VERSION=\"0.6.2\"
lib_deps =
    lvgl/lvgl@8.4.0
