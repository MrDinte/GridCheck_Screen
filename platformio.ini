; GridCheck firmware for two Waveshare screens:
;   waveshare_7b  ESP32-S3-Touch-LCD-7B (1024x600, 16MB flash, 8MB PSRAM)
;   knob18        ESP32-S3-Knob-Touch-LCD-1.8 / 1.8B (360x360 round, rotary knob, 16MB flash, 8MB PSRAM)
; ESP-IDF 5 (not Arduino): the 7" RGB screen needs ESP-IDF's bounce buffers and
; code running from PSRAM to stay stable while Wi-Fi is busy.
;
;   pio run                     build both (pio run -e knob18 for one)
;   pio run -e knob18 -t upload flash over USB
;   pio device monitor          watch the log (115200 baud)
;   sh tools/package.sh         build, sign and write docs/firmware/ for both screens

; shared by both screens: the version number lives here only
[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -DEH_VERSION=\"0.8.5\"
lib_deps =
    lvgl/lvgl@8.4.0

[env:waveshare_7b]
board_build.flash_mode = qio

[env:knob18]
board_build.flash_mode = dio
board_build.cmake_extra_args = -DGC_BOARD=knob18
build_flags =
    ${env.build_flags}
    -DGC_KNOB18
